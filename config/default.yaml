mcmc:
  n_simulations: 25000
  n_steps: 30
  n_regimes: 3
  transition_smoothing: 0.5

signal:
  slope_threshold: 10.0
  mtf_min_alignment: 3
  band_width_max: 0.05
  regime_confidence_min: 0.6
  signal_strength_min: 0.7
  mtf_weight: 0.3
  regime_weight: 0.3

risk:
  position_size_pct: 0.10
  max_position_pct: 0.25
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  daily_loss_limit_pct: 0.05

backtest:
  train_months: 6
  test_months: 2
  slippage_pct: 0.0002
  market_impact_pct: 0.0001
  min_trades: 100

llm:
  daily_budget_usd: 2.0
  signal_threshold: 0.75
  max_calls_per_day: 3

timeframes:
  - "1m"
  - "5m"
  - "15m"
  - "1h"
  - "1d"

# Options Swing Strategy (trading/options_swing.py) - buy dips in uptrends
# with in-the-money calls on index ETFs; typical hold 3-7 trading days.
# Chosen on 2011-2019 data, validated on 2020-present; see
# docs/OPTIONS_SWING_STRATEGY.md before changing anything here.
options_swing:
  symbols: [SPY, QQQ, IWM]
  # entry: close > SMA200, pullback >= min_pullback_atr, plus any trigger
  rsi2_max: 10.0
  ibs_max: 0.25
  ibs_rsi2_max: 15.0
  bb_z_max: -2.0
  min_pullback_atr: 1.5
  deep_pullback_atr: 2.0
  require_weekly_trend: false
  # structure: long_call (default) buys one ~long_delta call; call_debit_spread
  # also sells a short_delta call. 0.80-delta / 30 DTE / hold<=10 was chosen by
  # a pre-registered worst-case rule (scripts/research_robustness.py).
  structure_kind: long_call
  dte: 30
  long_delta: 0.80
  short_delta: 0.30
  # exits
  min_hold: 3
  max_hold: 10
  profit_target: 0.60   # gain on the debit (spreads: fraction of max profit)
  # portfolio
  risk_per_trade: 0.06  # premium paid (= max loss) as a fraction of equity
  max_concurrent: 2
  # shares alternative: fraction of equity per position (3 ETFs -> <= ~100%)
  shares_position_frac: 0.33
  # confidence tiers (score is 40 / 70 / 100; see confidence_score)
  high_confidence: 100
  medium_confidence: 70
